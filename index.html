<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Calendar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root { --grid-line: #e8eaed; }
  html, body { height: 100%; background:#fff; }
  body { font-family: 'Google Sans', 'Segoe UI', Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #dadce0; border-radius: 8px; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .event-pill { transition: filter .1s ease, transform .1s ease; }
  .event-pill:hover { filter: brightness(0.94); }
  .day-cell:hover { background: #f8f9fa; }
  @keyframes pop-in { from { opacity: 0; transform: scale(.96) translateY(2px);} to { opacity: 1; transform: scale(1) translateY(0);} }
  .pop-in { animation: pop-in .12s ease-out; }
  .fade-in { animation: fade .15s ease-out; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ============================== CONFIG ============================== */
// Fetch window: how far back / forward from "today" the app loads events for.
// Everything inside this window is fetched ONCE and then all view switching,
// navigation and calendar toggling is pure client-side filtering (instant).
const DAYS_BACK = 60;
const DAYS_FORWARD = 180;
const SCOPE = "https://www.googleapis.com/auth/calendar.readonly";

// Guaranteed-distinct palette assigned per calendar (by list order), so two
// calendars never collide even if Google's own colors are similar.
const PALETTE = [
  "#4285F4", "#EA4335", "#34A853", "#FBBC04", "#A142F4",
  "#F65DA0", "#00ACC1", "#FF7043", "#7CB342", "#9E9D24",
  "#5C6BC0", "#00897B", "#D81B60", "#6D4C41", "#546E7A",
];

/* ============================== DATE HELPERS ============================== */
const DAY_MS = 86400000;
const WEEKDAYS_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const startOfDay = (d) => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const addDays = (d, n) => new Date(d.getTime() + n * DAY_MS);
const isSameDay = (a, b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
const dateKey = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const startOfWeek = (d) => addDays(startOfDay(d), -d.getDay());
const startOfMonth = (d) => new Date(d.getFullYear(), d.getMonth(), 1);
const fmtTime = (d) => d.toLocaleTimeString([], { hour: "numeric", minute: d.getMinutes() ? "2-digit" : undefined });
const fmtDayHeader = (d) => `${WEEKDAYS_SHORT[d.getDay()]} ${d.getDate()}`;

/* ============================== GOOGLE AUTH HOOK ============================== */
function useGoogleAuth(clientId) {
  const [token, setToken] = useState(null);
  const [error, setError] = useState(null);
  const tokenClientRef = useRef(null);
  const silentInFlightRef = useRef(false);
  const [gisReady, setGisReady] = useState(!!window.google?.accounts?.oauth2);

  useEffect(() => {
    if (gisReady) return;
    const t = setInterval(() => {
      if (window.google?.accounts?.oauth2) { setGisReady(true); clearInterval(t); }
    }, 100);
    return () => clearInterval(t);
  }, [gisReady]);

  useEffect(() => {
    if (!gisReady || !clientId) return;
    try {
      tokenClientRef.current = window.google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: SCOPE,
        callback: (resp) => {
          if (resp.error) {
            // Only surface an error for an interactive attempt the user asked for —
            // a failed *silent* attempt just means "not signed in yet", not a real error.
            if (!silentInFlightRef.current) setError(resp.error);
            silentInFlightRef.current = false;
            return;
          }
          silentInFlightRef.current = false;
          setError(null);
          setToken({ access_token: resp.access_token, expires_at: Date.now() + (resp.expires_in * 1000) });
        },
      });
      // Try once, silently, with no UI at all. If this browser still has a valid
      // Google session and has already granted this app calendar access, this
      // returns a token with no popup. If not, it fails quietly and the person
      // just sees the normal "Sign in with Google" button.
      silentInFlightRef.current = true;
      tokenClientRef.current.requestAccessToken({ prompt: "none" });
    } catch (e) { setError(String(e)); }
  }, [gisReady, clientId]);

  const signIn = useCallback((prompt) => {
    if (!tokenClientRef.current) { setError("Google sign-in isn't ready yet — check your Client ID."); return; }
    silentInFlightRef.current = false;
    tokenClientRef.current.requestAccessToken({ prompt: prompt || "" });
  }, []);

  const signOut = useCallback(() => {
    if (token?.access_token && window.google?.accounts?.oauth2) {
      window.google.accounts.oauth2.revoke(token.access_token, () => {});
    }
    setToken(null);
  }, [token]);

  return { token, error, gisReady, signIn, signOut };
}

/* ============================== CALENDAR DATA HOOK ============================== */
function useCalendarData(token) {
  const [calendars, setCalendars] = useState([]);
  const [events, setEvents] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [lastSynced, setLastSynced] = useState(null);

  const load = useCallback(async () => {
    if (!token?.access_token) return;
    setLoading(true); setError(null);
    const headers = { Authorization: `Bearer ${token.access_token}` };
    try {
      const listRes = await fetch("https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=freeBusyReader", { headers });
      if (!listRes.ok) throw new Error(`Couldn't load your calendar list (${listRes.status}).`);
      const listJson = await listRes.json();
      const cals = (listJson.items || []).map((c, i) => ({
        id: c.id,
        summary: c.summaryOverride || c.summary,
        color: PALETTE[i % PALETTE.length],
        primary: !!c.primary,
      }));
      setCalendars(cals);

      const timeMin = addDays(startOfDay(new Date()), -DAYS_BACK).toISOString();
      const timeMax = addDays(startOfDay(new Date()), DAYS_FORWARD).toISOString();

      const fetchAllPages = async (cal) => {
        let items = [];
        let pageToken = undefined;
        do {
          const params = new URLSearchParams({
            timeMin, timeMax, singleEvents: "true", orderBy: "startTime", maxResults: "2500",
          });
          if (pageToken) params.set("pageToken", pageToken);
          const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal.id)}/events?${params.toString()}`;
          const res = await fetch(url, { headers });
          if (!res.ok) return items; // skip calendars we can't read, don't fail the whole app
          const json = await res.json();
          items = items.concat((json.items || []).map((e) => normalizeEvent(e, cal)));
          pageToken = json.nextPageToken;
        } while (pageToken);
        return items;
      };

      const results = await Promise.all(cals.map(fetchAllPages));
      setEvents(results.flat());
      setLastSynced(new Date());
    } catch (e) {
      setError(e.message || String(e));
    } finally {
      setLoading(false);
    }
  }, [token]);

  useEffect(() => { load(); }, [load]);

  return { calendars, events, loading, error, reload: load, lastSynced };
}

function normalizeEvent(e, cal) {
  const allDay = !!e.start?.date;
  const start = new Date(e.start?.dateTime || e.start?.date);
  const endRaw = new Date(e.end?.dateTime || e.end?.date);
  const end = allDay ? addDays(endRaw, -1) : endRaw; // Google end-date for all-day is exclusive
  return {
    id: e.id,
    calendarId: cal.id,
    calendarName: cal.summary,
    color: cal.color,
    title: e.summary || "(No title)",
    location: e.location || "",
    description: e.description || "",
    htmlLink: e.htmlLink,
    allDay,
    start, end,
  };
}

/* ============================== EVENT INDEX ============================== */
// Index events by every date they touch, for O(1) day lookups in Month/Week views.
function useEventsByDay(events) {
  return useMemo(() => {
    const map = new Map();
    for (const ev of events) {
      let cursor = startOfDay(ev.start);
      const last = startOfDay(ev.end);
      let guard = 0;
      while (cursor.getTime() <= last.getTime() && guard < 400) {
        const key = dateKey(cursor);
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(ev);
        cursor = addDays(cursor, 1);
        guard++;
      }
    }
    for (const arr of map.values()) {
      arr.sort((a, b) => (b.allDay - a.allDay) || (a.start - b.start));
    }
    return map;
  }, [events]);
}

/* ============================== SMALL UI PIECES ============================== */
function IconButton({ onClick, title, children, className = "" }) {
  return (
    <button onClick={onClick} title={title} aria-label={title}
      className={`w-9 h-9 flex items-center justify-center rounded-full hover:bg-gray-100 active:bg-gray-200 text-gray-600 ${className}`}>
      {children}
    </button>
  );
}

function ChevronLeft() { return <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>; }
function ChevronRight() { return <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>; }
function RefreshIcon() { return <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 4v6h6M20 20v-6h-6M4.5 15a8 8 0 0013.9 3.2M19.5 9A8 8 0 005.6 5.8" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>; }

function EventPopover({ event, anchorRect, onClose }) {
  if (!event) return null;
  const style = {};
  return (
    <div className="fixed inset-0 z-40" onClick={onClose}>
      <div
        className="absolute z-50 w-80 bg-white rounded-xl shadow-2xl border border-gray-100 pop-in overflow-hidden"
        style={{ top: Math.min(anchorRect.top, window.innerHeight - 260), left: Math.min(anchorRect.left, window.innerWidth - 336) }}
        onClick={(e) => e.stopPropagation()}
      >
        <div className="h-1.5" style={{ background: event.color }} />
        <div className="p-4">
          <div className="flex items-start justify-between gap-2">
            <h3 className="font-medium text-gray-900 text-base leading-snug">{event.title}</h3>
            <button onClick={onClose} className="text-gray-400 hover:text-gray-600 shrink-0">✕</button>
          </div>
          <p className="text-sm text-gray-600 mt-2">
            {event.allDay ? "All day" : `${fmtTime(event.start)} – ${fmtTime(event.end)}`}
            {!event.allDay && <span className="block text-gray-400">{event.start.toDateString()}</span>}
          </p>
          {event.location && (
            <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(event.location)}`}
              target="_blank" rel="noopener noreferrer"
              className="flex items-start gap-1.5 text-sm text-blue-600 hover:underline mt-2">
              <span>📍</span><span>{event.location}</span>
            </a>
          )}
          <div className="flex items-center gap-2 mt-3">
            <span className="w-2.5 h-2.5 rounded-full" style={{ background: event.color }} />
            <span className="text-sm text-gray-500 truncate">{event.calendarName}</span>
          </div>
          {event.description && (
            <p className="text-sm text-gray-600 mt-3 line-clamp-4 whitespace-pre-wrap">{event.description}</p>
          )}
          {event.htmlLink && (
            <a href={event.htmlLink} target="_blank" rel="noopener noreferrer"
              className="inline-block mt-3 text-sm font-medium text-blue-600 hover:underline">
              Open in Google Calendar →
            </a>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================== MONTH VIEW ============================== */
function MonthView({ anchorDate, eventsByDay, onPickEvent, onPickDay }) {
  const gridStart = startOfWeek(startOfMonth(anchorDate));
  const days = Array.from({ length: 42 }, (_, i) => addDays(gridStart, i));
  const today = startOfDay(new Date());

  return (
    <div className="flex flex-col h-full">
      <div className="grid grid-cols-7 border-b border-gray-200 text-xs font-medium text-gray-500 shrink-0">
        {WEEKDAYS_SHORT.map((w) => <div key={w} className="py-2 text-center">{w}</div>)}
      </div>
      <div className="grid grid-cols-7 grid-rows-6 flex-1 min-h-0 gap-px" style={{ background: "gainsboro" }}>
        {days.map((d) => {
          const key = dateKey(d);
          const dayEvents = eventsByDay.get(key) || [];
          const inMonth = d.getMonth() === anchorDate.getMonth();
          const isToday = isSameDay(d, today);
          const visible = dayEvents.slice(0, 3);
          const overflow = dayEvents.length - visible.length;
          return (
            <div key={key} onClick={() => onPickDay(d, dayEvents)}
              className={`day-cell p-1 flex flex-col min-h-0 cursor-pointer ${isToday ? "bg-blue-50" : inMonth ? "bg-slate-50" : "bg-gray-100/70"}`}>
              <div className="flex justify-end mb-1">
                <span className={`text-xs w-6 h-6 flex items-center justify-center rounded-full ${isToday ? "text-blue-700 font-semibold" : inMonth ? "text-gray-700" : "text-gray-400"}`}>
                  {d.getDate()}
                </span>
              </div>
              <div className="flex-1 min-h-0 space-y-1 overflow-hidden">
                {visible.map((ev) => (
                  <div key={ev.id + key} onClick={(e) => { e.stopPropagation(); onPickEvent(ev, e); }}
                    className="event-pill text-base leading-5 px-2 py-1 rounded-lg truncate text-white font-medium shadow-sm"
                    style={{ background: ev.color }}>
                    {!ev.allDay && <span className="opacity-90">{fmtTime(ev.start)} </span>}
                    {ev.title}
                  </div>
                ))}
                {overflow > 0 && <div className="text-[11px] text-gray-500 pl-1.5">+{overflow} more</div>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ============================== WEEK VIEW ============================== */
function WeekView({ anchorDate, eventsByDay, onPickEvent }) {
  const weekStart = startOfWeek(anchorDate);
  const days = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
  const today = startOfDay(new Date());
  const hours = Array.from({ length: 24 }, (_, i) => i);
  const scrollRef = useRef(null);
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = 6 * 48; }, [anchorDate]);

  const allDayByDay = days.map((d) => (eventsByDay.get(dateKey(d)) || []).filter((e) => e.allDay));
  const timedByDay = days.map((d) => (eventsByDay.get(dateKey(d)) || []).filter((e) => !e.allDay));

  return (
    <div className="flex flex-col h-full min-h-0">
      <div className="grid shrink-0" style={{ gridTemplateColumns: "56px repeat(7, 1fr)" }}>
        <div />
        {days.map((d) => (
          <div key={dateKey(d)} className="text-center py-2 border-b border-gray-200">
            <div className="text-xs text-gray-500">{WEEKDAYS_SHORT[d.getDay()]}</div>
            <div className={`mx-auto mt-0.5 w-7 h-7 flex items-center justify-center rounded-full text-sm ${isSameDay(d, today) ? "bg-blue-600 text-white font-semibold" : "text-gray-800"}`}>{d.getDate()}</div>
          </div>
        ))}
      </div>
      {allDayByDay.some((a) => a.length) && (
        <div className="grid shrink-0 border-b border-gray-200" style={{ gridTemplateColumns: "56px repeat(7, 1fr)" }}>
          <div className="text-[10px] text-gray-400 flex items-center justify-end pr-1">all-day</div>
          {allDayByDay.map((evs, i) => (
            <div key={i} className="p-1 space-y-0.5 border-l border-gray-100">
              {evs.map((ev) => (
                <div key={ev.id} onClick={(e) => onPickEvent(ev, e)}
                  className="event-pill text-[11px] px-1.5 rounded truncate text-white cursor-pointer" style={{ background: ev.color }}>
                  {ev.title}
                </div>
              ))}
            </div>
          ))}
        </div>
      )}
      <div ref={scrollRef} className="flex-1 min-h-0 overflow-y-auto">
        <div className="grid relative" style={{ gridTemplateColumns: "56px repeat(7, 1fr)" }}>
          <div>
            {hours.map((h) => (
              <div key={h} className="h-12 text-[10px] text-gray-400 text-right pr-1 -translate-y-2">
                {h === 0 ? "" : `${h % 12 === 0 ? 12 : h % 12}${h < 12 ? "AM" : "PM"}`}
              </div>
            ))}
          </div>
          {days.map((d, colIdx) => (
            <div key={dateKey(d)} className="relative border-l border-gray-100">
              {hours.map((h) => <div key={h} className="h-12 border-b border-gray-100" />)}
              {timedByDay[colIdx].map((ev) => {
                const startMin = ev.start.getHours() * 60 + ev.start.getMinutes();
                const endMin = Math.max(startMin + 20, ev.end.getHours() * 60 + ev.end.getMinutes());
                const top = (startMin / 60) * 48;
                const height = Math.max(18, ((endMin - startMin) / 60) * 48 - 2);
                return (
                  <div key={ev.id} onClick={(e) => onPickEvent(ev, e)}
                    className="event-pill absolute left-0.5 right-0.5 rounded-md text-white text-[11px] px-1.5 py-0.5 overflow-hidden cursor-pointer shadow-sm"
                    style={{ top, height, background: ev.color }}>
                    <div className="font-medium truncate">{ev.title}</div>
                    <div className="opacity-90 truncate">{fmtTime(ev.start)}</div>
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ============================== SCHEDULE / AGENDA VIEW ============================== */
function ScheduleView({ events, onPickEvent }) {
  const grouped = useMemo(() => {
    const sorted = [...events].sort((a, b) => a.start - b.start);
    const groups = [];
    let lastKey = null;
    for (const ev of sorted) {
      const key = dateKey(ev.start);
      if (key !== lastKey) { groups.push({ key, date: startOfDay(ev.start), items: [] }); lastKey = key; }
      groups[groups.length - 1].items.push(ev);
    }
    return groups;
  }, [events]);

  const today = startOfDay(new Date());

  if (!grouped.length) {
    return <div className="flex items-center justify-center h-full text-gray-400 text-sm">No events match the current filters.</div>;
  }

  return (
    <div className="h-full overflow-y-auto px-4 py-2">
      {grouped.map((g) => (
        <div key={g.key} className="flex border-b border-gray-100 py-3">
          <div className="w-20 shrink-0">
            <div className={`text-sm font-medium ${isSameDay(g.date, today) ? "text-blue-600" : "text-gray-700"}`}>{WEEKDAYS_SHORT[g.date.getDay()]}</div>
            <div className={`text-2xl ${isSameDay(g.date, today) ? "text-blue-600 font-semibold" : "text-gray-800"}`}>{g.date.getDate()}</div>
            <div className="text-xs text-gray-400">{MONTHS[g.date.getMonth()].slice(0,3)}</div>
          </div>
          <div className="flex-1 space-y-1.5 min-w-0">
            {g.items.map((ev) => (
              <div key={ev.id} onClick={(e) => onPickEvent(ev, e)}
                className="event-pill flex items-center gap-3 rounded-lg px-3 py-2 bg-gray-50 hover:bg-gray-100 cursor-pointer">
                <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: ev.color }} />
                <span className="text-sm text-gray-500 w-20 shrink-0">{ev.allDay ? "All day" : fmtTime(ev.start)}</span>
                <span className="text-sm text-gray-800 truncate">{ev.title}</span>
                <span className="text-xs text-gray-400 truncate ml-auto hidden sm:block">{ev.calendarName}</span>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ============================== CALENDAR DROPDOWN ============================== */
function CalendarDropdown({ calendars, enabled, onToggle, onAll, onNone, open, setOpen }) {
  const count = enabled.size;
  return (
    <div className="relative">
      <button onClick={() => setOpen((o) => !o)}
        className={`flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-full border transition-colors ${open ? "bg-gray-100 border-gray-300" : "border-gray-300 hover:bg-gray-50"}`}>
        <span className="text-gray-700 font-medium">Calendars</span>
        <span className="text-gray-400 text-xs">({count})</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" className={`transition-transform ${open ? "rotate-180" : ""}`}>
          <path d="M6 9l6 6 6-6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </button>
      {open && (
        <React.Fragment>
          <div className="fixed inset-0 z-30" onClick={() => setOpen(false)} />
          <div className="absolute left-0 mt-2 w-72 bg-white rounded-xl shadow-2xl border border-gray-100 pop-in overflow-hidden z-40">
            <div className="px-4 py-2.5 flex items-center justify-between border-b border-gray-100">
              <span className="text-xs font-semibold text-gray-500 uppercase tracking-wide">My calendars</span>
              <div className="flex gap-2 text-[11px] text-blue-600">
                <button onClick={onAll} className="hover:underline">All</button>
                <button onClick={onNone} className="hover:underline">None</button>
              </div>
            </div>
            <div className="max-h-80 overflow-y-auto px-2 py-2">
              {calendars.map((c) => (
                <label key={c.id} className="flex items-center gap-2.5 px-2 py-1.5 rounded-lg hover:bg-gray-50 cursor-pointer">
                  <input type="checkbox" checked={enabled.has(c.id)} onChange={() => onToggle(c.id)} className="sr-only" />
                  <span className="w-4 h-4 rounded-[4px] flex items-center justify-center shrink-0"
                    style={{ background: enabled.has(c.id) ? c.color : "#fff", border: `2px solid ${c.color}` }}>
                    {enabled.has(c.id) && <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="white" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                  </span>
                  <span className="text-sm text-gray-700 truncate">{c.summary}</span>
                </label>
              ))}
              {!calendars.length && <div className="text-xs text-gray-400 px-2 py-4">No calendars loaded yet.</div>}
            </div>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

/* ============================== SIDEBAR ============================== */
function Sidebar({ search, setSearch, open, onCloseMobile }) {
  return (
    <div className={`
      fixed md:static inset-y-0 left-0 z-30 w-64 bg-white border-r border-gray-200 flex flex-col
      transform transition-transform md:transform-none
      ${open ? "translate-x-0" : "-translate-x-full"} md:translate-x-0
    `}>
      <div className="p-3 md:hidden flex justify-end">
        <button onClick={onCloseMobile} className="text-gray-400 text-lg">✕</button>
      </div>
      <div className="px-4 pt-2 pb-3">
        <input
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          placeholder="Search events"
          className="w-full text-sm px-3 py-2 rounded-full bg-gray-100 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none border border-transparent"
        />
      </div>
    </div>
  );
}

/* ============================== SETUP / SIGN-IN SCREEN ============================== */
function SetupScreen({ clientId, setClientId, gisReady, error, onConnect }) {
  const [draft, setDraft] = useState(clientId);
  return (
    <div className="min-h-screen flex items-center justify-center bg-gray-50 px-4">
      <div className="max-w-md w-full bg-white rounded-2xl shadow-lg border border-gray-100 p-8">
        <div className="text-3xl mb-2">📅</div>
        <h1 className="text-xl font-semibold text-gray-900">Connect Google Calendar</h1>
        <p className="text-sm text-gray-500 mt-1.5 leading-relaxed">
          Paste your Google OAuth <span className="font-medium">Web Client ID</span>. It's saved only in this
          browser's local storage — nothing is sent anywhere except Google's own APIs.
        </p>
        <input
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          placeholder="xxxxxxxxxxxx.apps.googleusercontent.com"
          className="mt-4 w-full text-sm px-3 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none"
        />
        {error && <p className="text-xs text-red-500 mt-2">{error}</p>}
        <button
          onClick={() => { setClientId(draft.trim()); onConnect(); }}
          disabled={!draft.trim() || !gisReady}
          className="mt-4 w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 text-white text-sm font-medium py-2.5 rounded-lg transition-colors">
          {gisReady ? "Sign in with Google" : "Loading Google sign-in…"}
        </button>
        <details className="mt-5 text-xs text-gray-400">
          <summary className="cursor-pointer hover:text-gray-600">Where do I get a Client ID?</summary>
          <ol className="list-decimal list-inside mt-2 space-y-1 leading-relaxed">
            <li>Open Google Cloud Console → APIs &amp; Services → Credentials.</li>
            <li>Enable the "Google Calendar API".</li>
            <li>Create an OAuth 2.0 Client ID of type "Web application".</li>
            <li>Add this page's exact URL as an Authorized JavaScript origin (and where you'll embed it, e.g. your Google Sites domain).</li>
            <li>Paste the Client ID above.</li>
          </ol>
        </details>
      </div>
    </div>
  );
}

/* ============================== APP ============================== */
const VIEWS = ["Month", "Week", "Schedule"];

function App() {
  const [clientId, setClientId] = useState(() => localStorage.getItem("gcal_client_id") || "778571516682-djlqjon5n3057ov6o786q92g73kf4rv7.apps.googleusercontent.com");
  useEffect(() => { if (clientId) localStorage.setItem("gcal_client_id", clientId); }, [clientId]);

  const { token, error: authError, gisReady, signIn, signOut } = useGoogleAuth(clientId);
  const { calendars, events, loading, error: dataError, reload, lastSynced } = useCalendarData(token);

  const [enabled, setEnabled] = useState(new Set());
  useEffect(() => { setEnabled(new Set(calendars.map((c) => c.id))); }, [calendars]);

  const [view, setView] = useState("Month");
  const [anchorDate, setAnchorDate] = useState(new Date());
  const [search, setSearch] = useState("");
  const [popover, setPopover] = useState(null); // { event, anchorRect }
  const [dayModal, setDayModal] = useState(null); // { date, events }
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [calMenuOpen, setCalMenuOpen] = useState(false);

  // Instant client-side filter — just array ops over already-fetched events.
  const filteredEvents = useMemo(() => {
    const q = search.trim().toLowerCase();
    return events.filter((e) => enabled.has(e.calendarId) && (!q || e.title.toLowerCase().includes(q) || e.location.toLowerCase().includes(q)));
  }, [events, enabled, search]);

  const eventsByDay = useEventsByDay(filteredEvents);

  const scheduleRangeEvents = useMemo(() => {
    const from = addDays(startOfDay(new Date()), 0);
    return filteredEvents.filter((e) => e.end >= from).sort((a,b) => a.start - b.start);
  }, [filteredEvents]);

  const toggleCal = useCallback((id) => {
    setEnabled((prev) => { const next = new Set(prev); next.has(id) ? next.delete(id) : next.add(id); return next; });
  }, []);
  const enableAll = useCallback(() => setEnabled(new Set(calendars.map((c) => c.id))), [calendars]);
  const enableNone = useCallback(() => setEnabled(new Set()), []);

  const step = useCallback((dir) => {
    setAnchorDate((d) => {
      if (view === "Month") return new Date(d.getFullYear(), d.getMonth() + dir, 1);
      if (view === "Week") return addDays(d, 7 * dir);
      return addDays(d, 7 * dir);
    });
  }, [view]);

  const headerLabel = useMemo(() => {
    if (view === "Month") return `${MONTHS[anchorDate.getMonth()]} ${anchorDate.getFullYear()}`;
    if (view === "Week") {
      const s = startOfWeek(anchorDate), e = addDays(s, 6);
      return s.getMonth() === e.getMonth()
        ? `${MONTHS[s.getMonth()]} ${s.getDate()}–${e.getDate()}, ${e.getFullYear()}`
        : `${MONTHS[s.getMonth()].slice(0,3)} ${s.getDate()} – ${MONTHS[e.getMonth()].slice(0,3)} ${e.getDate()}, ${e.getFullYear()}`;
    }
    return "Upcoming";
  }, [view, anchorDate]);

  const openEvent = useCallback((ev, mouseEvent) => {
    const rect = mouseEvent.currentTarget.getBoundingClientRect();
    setPopover({ event: ev, anchorRect: { top: rect.bottom + 6, left: rect.left } });
  }, []);

  if (!token) {
    return <SetupScreen clientId={clientId} setClientId={setClientId} gisReady={gisReady} error={authError} onConnect={() => signIn("")} />;
  }

  return (
    <div className="h-screen w-screen flex flex-col overflow-hidden bg-white text-gray-900">
      {/* Top nav */}
      <header className="flex items-center gap-2 px-3 md:px-4 h-14 border-b border-gray-200 shrink-0">
        <button className="md:hidden w-9 h-9 flex items-center justify-center rounded-full hover:bg-gray-100" onClick={() => setSidebarOpen(true)}>☰</button>
        <span className="text-lg mr-1">📅</span>
        <span className="font-medium text-gray-700 hidden sm:inline">Calendar</span>
        <IconButton title="Today" onClick={() => setAnchorDate(new Date())}
          className="w-auto px-3 border border-blue-200 text-sm font-medium rounded-lg ml-2 !bg-blue-50 hover:!bg-blue-100 !text-blue-700">Today</IconButton>
        <IconButton title="Previous" onClick={() => step(-1)}><ChevronLeft/></IconButton>
        <IconButton title="Next" onClick={() => step(1)}><ChevronRight/></IconButton>
        <h2 className="text-base md:text-lg font-normal text-gray-800 ml-1 truncate">{headerLabel}</h2>

        <div className="ml-auto flex items-center gap-1.5">
          <CalendarDropdown calendars={calendars} enabled={enabled} onToggle={toggleCal} onAll={enableAll} onNone={enableNone}
            open={calMenuOpen} setOpen={setCalMenuOpen} />
          <div className="hidden sm:flex bg-gray-100 rounded-full p-0.5 mr-1">
            {VIEWS.map((v) => (
              <button key={v} onClick={() => setView(v)}
                className={`text-sm px-3 py-1.5 rounded-full transition-colors ${view === v ? "bg-white shadow text-gray-900 font-medium" : "text-gray-500 hover:text-gray-700"}`}>
                {v}
              </button>
            ))}
          </div>
          <select value={view} onChange={(e) => setView(e.target.value)} className="sm:hidden text-sm border border-gray-300 rounded-lg px-2 py-1.5">
            {VIEWS.map((v) => <option key={v} value={v}>{v}</option>)}
          </select>
          <IconButton title={loading ? "Syncing…" : "Refresh"} onClick={reload} className={loading ? "animate-spin" : ""}><RefreshIcon/></IconButton>
          <button onClick={signOut} className="text-xs text-gray-400 hover:text-gray-600 px-2 hidden md:inline">Sign out</button>
        </div>
      </header>

      {dataError && <div className="bg-red-50 text-red-600 text-xs px-4 py-1.5 border-b border-red-100">{dataError}</div>}

      <div className="flex flex-1 min-h-0">
        {sidebarOpen && <div className="fixed inset-0 bg-black/20 z-20 md:hidden" onClick={() => setSidebarOpen(false)} />}
        <Sidebar
          search={search} setSearch={setSearch} open={sidebarOpen} onCloseMobile={() => setSidebarOpen(false)}
        />
        <main className="flex-1 min-w-0 min-h-0" style={{ background: "gainsboro" }}>
          {loading && !events.length ? (
            <div className="h-full flex items-center justify-center text-gray-400 text-sm">Loading your calendars…</div>
          ) : view === "Month" ? (
            <MonthView anchorDate={anchorDate} eventsByDay={eventsByDay} onPickEvent={openEvent}
              onPickDay={(d, evs) => setDayModal({ date: d, events: evs })} />
          ) : view === "Week" ? (
            <WeekView anchorDate={anchorDate} eventsByDay={eventsByDay} onPickEvent={openEvent} />
          ) : (
            <ScheduleView events={scheduleRangeEvents} onPickEvent={openEvent} />
          )}
        </main>
      </div>

      <footer className="text-[11px] text-gray-400 px-4 py-1 border-t border-gray-100 shrink-0 flex justify-between">
        <span>{filteredEvents.length} events shown{lastSynced ? ` · synced ${lastSynced.toLocaleTimeString()}` : ""}</span>
        <span>Window: {DAYS_BACK}d back → {DAYS_FORWARD}d ahead</span>
      </footer>

      {popover && <EventPopover event={popover.event} anchorRect={popover.anchorRect} onClose={() => setPopover(null)} />}

      {dayModal && (
        <div className="fixed inset-0 bg-black/20 z-40 flex items-center justify-center fade-in" onClick={() => setDayModal(null)}>
          <div className="bg-white rounded-xl shadow-2xl w-80 max-h-[70vh] overflow-y-auto pop-in" onClick={(e) => e.stopPropagation()}>
            <div className="p-4 border-b border-gray-100 flex justify-between items-center">
              <h3 className="font-medium">{fmtDayHeader(dayModal.date)}</h3>
              <button onClick={() => setDayModal(null)} className="text-gray-400 hover:text-gray-600">✕</button>
            </div>
            <div className="p-2">
              {dayModal.events.length === 0 && <div className="text-sm text-gray-400 p-3">No events.</div>}
              {dayModal.events.map((ev) => (
                <div key={ev.id} onClick={(e) => { setDayModal(null); openEvent(ev, e); }}
                  className="flex items-center gap-2 px-2.5 py-2 rounded-lg hover:bg-gray-50 cursor-pointer">
                  <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: ev.color }} />
                  <span className="text-sm text-gray-500 w-16 shrink-0">{ev.allDay ? "All day" : fmtTime(ev.start)}</span>
                  <span className="text-sm text-gray-800 truncate">{ev.title}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
