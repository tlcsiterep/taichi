<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: transparent;
      color: #333;
    }

    .schedule-container {
      width: 100%;
      max-width: none;
      margin: 0 auto;
      padding: 8px;
      max-height: none;
      overflow: visible;
    }

    .schedule-title {
      margin: 0 0 25px 0;
      font-size: 28px;
      font-weight: 700;
    }

    .api-status {
      display: none;
      margin: 0 0 18px;
      padding: 9px 14px;
      border-radius: 8px;
      background: #fdecea;
      color: #a33a2f;
      font-size: 13px;
      line-height: 1.4;
    }

    .api-status.show {
      display: block;
    }

    .day-section {
      margin-bottom: 22px;
    }

    .day-header {
       padding: 12px 0 9px 0;
       border-bottom: 2px solid #bbb;
       font-size: 19px;
       font-weight: 700;
    }

    .class-row {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 15px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .class-time {
      text-align: right;
      font-size: 14px;
      color: #666;
      white-space: nowrap;
    }

    .class-name {
      font-size: 15px;
      font-weight: 600;
    }

    .empty-message {
      padding: 30px 0;
      color: #777;
    }

    @media (max-width: 600px) {

      .schedule-container {
        padding: 18px;
      }

      .schedule-title {
        font-size: 24px;
      }

      .class-row {
        grid-template-columns: 80px 1fr;
        gap: 10px;
      }

      .class-time {
        font-size: 12px;
      }

      .class-name {
        font-size: 14px;
      }
    }

  </style>
</head>

<body>

  <div class="schedule-container">

    <h1 class="schedule-title">
      UPCOMING SESSIONS
    </h1>

    <div id="apiStatus" class="api-status"></div>

    <div id="scheduleFeed"></div>

  </div>


  <script>

    /* ==========================================
       SETUP — the only thing you must edit
       ==========================================
       Paste your Apps Script Web App URL below.
       Get it from the Apps Script editor:
       Deploy → Manage deployments → Web app → URL
       (it ends in /exec). Use the SAME URL as on
       your main calendar page.
       ========================================== */

    const APPS_SCRIPT_URL = "YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

    /* ==========================================
       APPS SCRIPT API HELPER
       Replaces google.script.run (which only
       exists when a page is served BY Apps
       Script itself) with a plain fetch() call
       to the JSON endpoints already built into
       Code.gs's doGet/githubCalendarApi.
       ========================================== */

    function callAppsScriptApi(params) {

      if (
        !APPS_SCRIPT_URL ||
        APPS_SCRIPT_URL === "YOUR_APPS_SCRIPT_WEB_APP_URL_HERE"
      ) {

        return Promise.reject(
          new Error(
            "Set APPS_SCRIPT_URL near the top of the <script> section first."
          )
        );

      }

      const url =
        new URL(APPS_SCRIPT_URL);

      Object.keys(params).forEach(function(key) {
        url.searchParams.set(key, params[key]);
      });

      return fetch(url.toString())
        .then(function(response) {

          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }

          return response.json();

        })
        .then(function(data) {

          if (data && data.error) {
            throw new Error(data.error);
          }

          return data;

        });

    }

    function showApiError(message) {

      const banner =
        document.getElementById("apiStatus");

      banner.textContent = message;
      banner.classList.add("show");

    }

    function clearApiError() {

      const banner =
        document.getElementById("apiStatus");

      banner.textContent = "";
      banner.classList.remove("show");

    }

    let calendarColors = {};

    let selectedCalendars = {};

    const upcomingCalendarCache = {};


    /*
     * Load calendar configuration
     */

    function loadCalendarConfig() {

      callAppsScriptApi({ api: "calendarList" })

        .then(function(config) {

          clearApiError();

          config.forEach(function(calendar) {

            calendarColors[calendar.name] =
              calendar.color;

            selectedCalendars[calendar.name] =
              true;

          });

          // If the events have already loaded,
          // render them now.
          if (window.upcomingEventsData) {
            processUpcomingEvents(
              window.upcomingEventsData
            );
          }

        })

        .catch(function(error) {

          console.error("Failed to load calendar list:", error);

          showApiError(
            "Couldn't load the calendar list. Check APPS_SCRIPT_URL and that the Apps Script is deployed for \"Anyone\" access."
          );

        });

      // Start loading events immediately.
      // This no longer waits for getCalendarList().
      loadCurrentWeek();
    }


    function loadCurrentWeek() {

      const today =
        new Date();

      const startDate =
        new Date(today);

      startDate.setHours(
        0, 0, 0, 0
      );

      startDate.setDate(
        startDate.getDate() -
        startDate.getDay()
      );

      const endDate =
        new Date(startDate);

      endDate.setDate(
        endDate.getDate() + 7
      );


      callAppsScriptApi({
        api: "upcoming",
        start: startDate.toISOString(),
        end: endDate.toISOString()
      })

        .then(function(events) {

          clearApiError();

          // Save the events temporarily.
          window.upcomingEventsData =
            events;

          // If calendar configuration
          // has already loaded, process now.
          if (
            Object.keys(selectedCalendars).length > 0
          ) {

            processUpcomingEvents(events);

          }

        })

        .catch(function(error) {

          console.error("Failed to load upcoming events:", error);

          showApiError(
            "Couldn't load upcoming classes. Check APPS_SCRIPT_URL and the Apps Script deployment."
          );

        });
    }


    function processUpcomingEvents(events) {

      const today =
        new Date();

      const startDate =
        new Date(today);

      startDate.setHours(
        0, 0, 0, 0
      );

      startDate.setDate(
        startDate.getDate() -
        startDate.getDay()
      );

      const endDate =
        new Date(startDate);

      endDate.setDate(
        endDate.getDate() + 7);


      const results = [];

      events.forEach(function(event) {

        const eventStart =
          new Date(event.start);

        if (
          eventStart >= startDate &&
          eventStart < endDate &&
          selectedCalendars[event.calendar] &&
          event.calendar !==
            "Holidays in United States"
        ) {

          results.push(event);

        }

      });


      renderSchedule(
        results,
        today
      );
    }

    /*
     * Render the current week
     */

    function renderSchedule(
      events,
      today
    ) {

      const feed =
        document.getElementById(
          "scheduleFeed"
        );

      feed.innerHTML = "";


      events.sort(
        function(a, b) {

          return (
            new Date(a.start) -
            new Date(b.start)
          );

        }
      );


      if (events.length === 0) {

        const empty =
          document.createElement("div");

        empty.className =
          "empty-message";

        empty.textContent =
          "No upcoming classes this week.";

        feed.appendChild(empty);

        return;

      }


      /*
       * Group events by date
       */

      const days = {};


      events.forEach(
        function(event) {

          const date =
            new Date(event.start);

          const key =
            date.getFullYear() +
            "-" +
            date.getMonth() +
            "-" +
            date.getDate();

          if (!days[key]) {
            days[key] = [];
          }

          days[key].push(event);

        }
      );


      Object.keys(days).forEach(
        function(key) {

          const dayEvents =
            days[key];

          const date =
            new Date(dayEvents[0].start);


          const daySection =
            document.createElement("div");

          daySection.className =
            "day-section";


          const dayHeader =
            document.createElement("div");

          dayHeader.className =
            "day-header";

          dayHeader.textContent =
            date.toLocaleDateString(
              undefined,
              {
                weekday: "long",
                month: "long",
                day: "numeric"
              }
            );


          daySection.appendChild(
            dayHeader
          );


          dayEvents.forEach(
            function(event) {

              const row =
                document.createElement("div");

              row.className =
                "class-row";


              const time =
                document.createElement("div");

              time.className =
                "class-time";

              time.textContent =
                event.allDay
                  ? "All day"
                  : formatTime(
                      new Date(event.start)
                    );


              const name =
                document.createElement("div");

              name.className =
                "class-name";

              name.textContent =
                event.calendar;

              /*start*/
              const indicator =
              document.createElement("span");

              indicator.style.display =
                "inline-block";

              indicator.style.width =
                "9px";

              indicator.style.height =
                "9px";

              indicator.style.borderRadius =
                "50%";

              indicator.style.backgroundColor =
                calendarColors[event.calendar]
                || "#777777";

              indicator.style.marginRight =
                "8px";

              name.prepend(indicator);
              /*end*/

              row.appendChild(time);
              row.appendChild(name);

              daySection.appendChild(row);

            }
          );


          feed.appendChild(
            daySection
          );

        }
      );

    }


    /*
     * Format time
     */

    function formatTime(date) {

      return date.toLocaleTimeString(
        undefined,
        {
          hour: "numeric",
          minute: "2-digit"
        }
      );

    }


    /*
     * Start
     */

    loadCalendarConfig();

  </script>

</body>
</html>
